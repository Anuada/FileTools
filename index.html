<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Usage Test Page</title>

  <!-- ✅ CONNECTED STYLE.CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h1>Image Scanner Test Page</h1>

  <p>This page is used to test your unused image detection tool.</p>

  <h2>1. Used Images (HTML)</h2>
  <img src="images/used-html-1.jpg" width="200" />
  <img src="images/used-html-2.jpg" width="200" />

  <h2>2. Used Image (CSS Background - from style.css)</h2>
  <div class="hero"></div>

  <h2>3. UNUSED CSS TEST BLOCKS</h2>

  <!-- These classes exist in style.css but are NOT used in layout -->
  <div class="unused-bg-1"></div>
  <div class="unused-bg-2"></div>
  <div class="unused-bg-3"></div>
  <div class="unused-bg-4"></div>
  <div class="unused-svg"></div>
  <div class="unused-combo"></div>

  <h2>4. Used Image (JS Loaded)</h2>
  <div id="js-image-container"></div>

  <script>
    // ✔ USED image via JS
    const img = document.createElement("img");
    img.src = "images/used-js.jpg";
    img.width = 200;
    document.getElementById("js-image-container").appendChild(img);

    // ❌ UNUSED JS image reference
    const unusedImage = "images/unused-js.jpg";
  </script>

  <h2>5. Lazy Loading Test</h2>
  <img data-src="images/used-lazy.jpg" width="200" />

  <h2>6. Unused Images (not referenced in DOM)</h2>
  <!-- These exist in folder but not used -->
  <!-- images/unused-html-1.jpg -->
  <!-- images/unused-html-2.jpg -->

</body>
</html>

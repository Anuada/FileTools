<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Usage Test Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    /* ✅ USED CSS IMAGE */
    .hero {
      width: 300px;
      height: 180px;
      background-image: url("images/used-css.jpg");
      background-size: cover;
      margin-bottom: 20px;
      border: 2px solid #333;
    }

    /* ❌ UNUSED CSS IMAGE (simple case) */
    .unused-css {
      background-image: url("images/unused-css-1.jpg");
    }

    /* ❌ UNUSED CSS IMAGE (multiple background format) */
    .unused-css-multi {
      background: url("images/unused-css-2.jpg") no-repeat center center;
    }

    /* ❌ UNUSED CSS IMAGE (shorthand with other properties) */
    .unused-css-shorthand {
      background: #fff url("images/unused-css-3.jpg") repeat;
    }

    /* ❌ UNUSED ICON / SVG */
    .unused-icon::before {
      content: url("images/unused-icon.svg");
    }

  </style>
</head>

<body>

  <h1>Image Scanner Test Page</h1>

  <p>This page is used to test your unused image detection tool.</p>

  <h2>1. Used Images (HTML)</h2>
  <img src="images/used-html-1.jpg" width="200" />
  <img src="images/used-html-2.jpg" width="200" />

  <h2>2. Used Image (CSS Background)</h2>
  <div class="hero"></div>

  <h2>3. Used Image (JS Loaded)</h2>
  <div id="js-image-container"></div>

  <script>
    // ✔ USED image via JS
    const img = document.createElement("img");
    img.src = "images/used-js.jpg";
    img.width = 200;
    document.getElementById("js-image-container").appendChild(img);

    // ❌ unused JS image reference
    const unusedImage = "images/unused-js.jpg";
  </script>

  <h2>4. Lazy Loading Test</h2>
  <img data-src="images/used-lazy.jpg" width="200" />

  <h2>5. Unused Images (should NOT appear in DOM usage)</h2>
  <!-- These images exist but are NOT used in page rendering -->
  <!-- images/unused-html-1.jpg -->
  <!-- images/unused-html-2.jpg -->

</body>
</html>
